# Rebuilds shows.json every morning from the band's Concert Archives page.
# A successful run that finds a new show commits it, which makes Vercel
# redeploy the site. A red X on this workflow = the scrape failed and the
# site is serving its last good data (nothing breaks, dates just go stale).
#
# Requirements: the SCRAPINGBEE_API_KEY repository secret must exist
# (Settings → Secrets and variables → Actions). Concert Archives blocks
# GitHub's servers, so the fetch goes through ScrapingBee (~1 credit/day).
#
# To change WHEN it runs: edit the cron line (UTC, format: min hour * * *).
# To run it RIGHT NOW: Actions tab → "Update shows data" → Run workflow.
name: Update shows data

on:
  schedule:
    - cron: '17 9 * * *'   # daily 09:17 UTC = ~5:17am ET
  workflow_dispatch: {}     # enables the manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape Concert Archives
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: node scripts/update-shows.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- shows.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows.json
          git commit -m "Update show dates from Concert Archives"
          git push

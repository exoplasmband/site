name: Update shows data

on:
  schedule:
    - cron: '17 9 * * *'   # daily ~5:17am ET
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape Concert Archives
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: node scripts/update-shows.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- shows.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows.json
          git commit -m "Update show dates from Concert Archives"
          git push
